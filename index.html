<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calcul coût du trajet</title>
  <style>
    :root{
      --bg:#eaf4ff;
      --card:#ffffff;
      --text:#355070;
      --muted:#6b7a90;
      --accent:#ff5a1f;
      --accent2:#2f80ed;
      --success:#2e9e44;
      --warning:#d9822b;
      --error:#d64545;
      --shadow:0 8px 24px rgba(53,80,112,.12);
      --radius:22px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial, Helvetica, sans-serif;
      background:var(--bg);
      color:var(--text);
      padding:20px;
    }
    .container{
      max-width:760px;
      margin:0 auto;
    }
    .title-card,.main-card{
      background:var(--card);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
    }
    .title-card{
      padding:20px;
      text-align:center;
      font-weight:700;
      letter-spacing:.5px;
      margin-bottom:18px;
      font-size:28px;
    }
    .main-card{
      padding:24px;
    }
    h2{
      margin:0 0 16px 0;
      text-align:center;
      font-size:22px;
    }
    .btn{
      width:100%;
      border:none;
      border-radius:16px;
      padding:16px 18px;
      font-size:18px;
      font-weight:700;
      cursor:pointer;
      color:#fff;
      background:linear-gradient(90deg,#ff6a3d,#f04d13);
      box-shadow:0 8px 18px rgba(240,77,19,.25);
    }
    .btn:disabled{opacity:.7;cursor:wait}
    .status{
      margin:14px 0 10px;
      padding:12px 14px;
      border-radius:14px;
      font-size:15px;
      line-height:1.4;
      text-align:center;
      display:none;
    }
    .status.show{display:block}
    .status.info{background:#eef6ff;color:#2d5b8a}
    .status.success{background:#ecf9ef;color:var(--success)}
    .status.warning{background:#fff6ea;color:var(--warning)}
    .status.error{background:#fff0f0;color:var(--error)}
    .location-line{
      margin:12px 0 16px;
      color:var(--muted);
      text-align:center;
      font-size:14px;
    }
    .manual-box{
      margin:12px 0 16px;
      padding:14px;
      border:1px dashed #c8d6e8;
      border-radius:16px;
      background:#f8fbff;
      display:none;
    }
    .manual-box.show{display:block}
    .manual-box h3{
      margin:0 0 10px;
      font-size:16px;
      text-align:center;
    }
    .manual-row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }
    .manual-row input{
      flex:1 1 220px;
      padding:12px 14px;
      border:1px solid #cfd9e6;
      border-radius:12px;
      font-size:15px;
    }
    .manual-row button{
      flex:0 0 auto;
      padding:12px 16px;
      border:none;
      border-radius:12px;
      background:var(--accent2);
      color:#fff;
      font-weight:700;
      cursor:pointer;
    }
    .fuel-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:14px;
      margin-top:14px;
    }
    .fuel-card{
      background:#f8fbff;
      border:2px solid transparent;
      border-radius:18px;
      padding:16px 12px;
      text-align:center;
      position:relative;
      min-height:190px;
      cursor:pointer;
    }
    .fuel-card.selected{
      border-color:#4aa3ff;
      box-shadow:0 0 0 3px rgba(74,163,255,.12);
    }
    .check{
      position:absolute;
      top:10px;
      right:10px;
      width:22px;
      height:22px;
      border-radius:50%;
      background:#4aa3ff;
      color:#fff;
      display:none;
      align-items:center;
      justify-content:center;
      font-size:13px;
      font-weight:700;
    }
    .fuel-card.selected .check{display:flex}
    .fuel-icon{
      width:62px;
      height:62px;
      margin:0 auto 10px;
      border-radius:16px;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#fff;
      font-weight:700;
      font-size:22px;
    }
    .e98{background:#f4b400}
    .e95{background:#4caf50}
    .dsl{background:#3fa9f5}
    .fuel-name{
      font-weight:700;
      font-size:22px;
      margin-bottom:2px;
    }
    .fuel-label{
      color:var(--muted);
      font-size:14px;
      margin-bottom:8px;
    }
    .fuel-card input{
      width:100%;
      padding:12px 10px;
      border-radius:12px;
      border:2px solid #dbe6f2;
      text-align:center;
      font-size:28px;
      font-weight:700;
      color:var(--text);
      background:#fff;
    }
    .fuel-meta{
      margin-top:8px;
      font-size:12px;
      color:var(--muted);
      line-height:1.35;
      min-height:34px;
    }
    .footer-note{
      text-align:center;
      margin-top:14px;
      color:#8c99ad;
      font-size:13px;
    }
    .tag{
      display:inline-block;
      margin-top:6px;
      padding:4px 8px;
      border-radius:999px;
      font-size:11px;
      font-weight:700;
    }
    .tag.api{background:#eaf7ee;color:var(--success)}
    .tag.manual{background:#eef4ff;color:#3b6fb6}
    @media (max-width:680px){
      .title-card{font-size:22px}
      .fuel-grid{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="title-card">⛽ CALCUL COÛT DU TRAJET</div>

    <div class="main-card">
      <h2>CHOISIS TON CARBURANT</h2>

      <button id="locBtn" class="btn">📍 Prix de la station la plus proche</button>

      <div id="status" class="status info"></div>

      <div id="locationLine" class="location-line">Aucune position encore récupérée.</div>

      <div id="manualBox" class="manual-box">
        <h3>Recherche manuelle si la géolocalisation échoue</h3>
        <div class="manual-row">
          <input id="manualCity" type="text" placeholder="Ex. Chevilly-Larue ou code postal" />
          <button id="manualSearchBtn">Rechercher</button>
        </div>
      </div>

      <div class="fuel-grid">
        <div class="fuel-card" id="card-e98">
          <div class="check">✓</div>
          <div class="fuel-icon e98">⛽</div>
          <div class="fuel-name">E98</div>
          <div class="fuel-label">Prix €/L</div>
          <input id="price-e98" type="number" step="0.001" value="1.99" />
          <div class="fuel-meta" id="meta-e98">En attente de récupération</div>
        </div>

        <div class="fuel-card" id="card-e95">
          <div class="check">✓</div>
          <div class="fuel-icon e95">⛽</div>
          <div class="fuel-name">E95</div>
          <div class="fuel-label">Prix €/L</div>
          <input id="price-e95" type="number" step="0.001" value="1.99" />
          <div class="fuel-meta" id="meta-e95">En attente de récupération</div>
        </div>

        <div class="fuel-card selected" id="card-dsl">
          <div class="check">✓</div>
          <div class="fuel-icon dsl">⛽</div>
          <div class="fuel-name">DSL</div>
          <div class="fuel-label">Diesel</div>
          <input id="price-dsl" type="number" step="0.001" value="1.99" />
          <div class="fuel-meta" id="meta-dsl">En attente de récupération</div>
        </div>
      </div>

      <div id="updateNote" class="footer-note">Aucune mise à jour pour le moment.</div>
    </div>
  </div>

  <script>
    const statusBox = document.getElementById('status');
    const locationLine = document.getElementById('locationLine');
    const manualBox = document.getElementById('manualBox');
    const manualCity = document.getElementById('manualCity');
    const manualSearchBtn = document.getElementById('manualSearchBtn');
    const locBtn = document.getElementById('locBtn');
    const updateNote = document.getElementById('updateNote');

    const fuels = {
      e98: { input: document.getElementById('price-e98'), meta: document.getElementById('meta-e98') },
      e95: { input: document.getElementById('price-e95'), meta: document.getElementById('meta-e95') },
      dsl: { input: document.getElementById('price-dsl'), meta: document.getElementById('meta-dsl') }
    };

    function showStatus(message, type = 'info') {
      statusBox.className = 'status show ' + type;
      statusBox.textContent = message;
    }

    function hideStatus() {
      statusBox.className = 'status';
      statusBox.textContent = '';
    }

    function nowLabel() {
      const d = new Date();
      return d.toLocaleDateString('fr-FR') + ' ' + d.toLocaleTimeString('fr-FR', {
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    function formatDistance(meters) {
      if (meters == null || isNaN(meters)) return 'distance inconnue';
      if (meters < 1000) return `${Math.round(meters)} m`;
      return `${(meters / 1000).toFixed(1).replace('.', ',')} km`;
    }

    function setFuelValue(key, price, infoText, source = 'api') {
      if (price !== null && price !== undefined && !isNaN(price)) {
        fuels[key].input.value = Number(price).toFixed(3);
        fuels[key].meta.innerHTML = `${infoText}<br><span class="tag ${source}">${source === 'api' ? 'API' : 'MANUEL'}</span>`;
      } else {
        fuels[key].meta.innerHTML = `${infoText}<br><span class="tag ${source}">${source === 'api' ? 'API' : 'MANUEL'}</span>`;
      }
    }

    function clearUnavailableFuel(key, message) {
      fuels[key].input.value = '';
      fuels[key].meta.innerHTML = `${message}<br><span class="tag api">API</span>`;
    }

    function resetMetaWaiting() {
      Object.values(fuels).forEach(f => {
        f.meta.textContent = 'Recherche en cours...';
      });
    }

    function geolocationErrorMessage(error) {
      if (!error) return 'Localisation indisponible.';
      switch (error.code) {
        case 1:
          return 'Localisation refusée par le navigateur.';
        case 2:
          return 'Position indisponible actuellement.';
        case 3:
          return 'Temps d’attente dépassé pour la localisation.';
        default:
          return 'Impossible de récupérer la localisation.';
      }
    }

    async function reverseGeocode(lat, lon) {
      try {
        const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&accept-language=fr`;
        const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
        const data = await res.json();
        return data.display_name || `${lat.toFixed(5)}, ${lon.toFixed(5)}`;
      } catch {
        return `${lat.toFixed(5)}, ${lon.toFixed(5)}`;
      }
    }

    async function geocodeCity(query) {
      const url = `https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=fr&accept-language=fr&q=${encodeURIComponent(query)}`;
      const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
      const data = await res.json();
      if (!data || !data.length) throw new Error('Lieu introuvable');
      return {
        lat: parseFloat(data[0].lat),
        lon: parseFloat(data[0].lon),
        label: data[0].display_name
      };
    }

    async function fetchNearestStationPrices(lat, lon, labelSource = '') {
      resetMetaWaiting();
      showStatus('Recherche de la station la plus proche...', 'info');
      locationLine.textContent = `Position utilisée : ${labelSource || `${lat.toFixed(5)}, ${lon.toFixed(5)}`}`;

      try {
        const apiUrl = `https://public.opendatasoft.com/api/explore/v2.1/catalog/datasets/prix-des-carburants-en-france-flux-instantane-v2/records?limit=1&where=services_service%20is%20not%20null&order_by=dist(geom%2C%20geom'POINT(${lon}%20${lat})')%20ASC&select=id,adresse,ville,cp,geom,prix,services_service`;

        const response = await fetch(apiUrl);
        const data = await response.json();

        if (!data.results || !data.results.length) {
          showStatus('Aucune station trouvée à proximité avec les critères actuels.', 'warning');
          updateNote.textContent = `Dernière tentative : ${nowLabel()}`;
          return;
        }

        const station = data.results[0];

        const stationLat = station?.geom?.lat ?? null;
        const stationLon = station?.geom?.lon ?? null;
        let distance = null;

        if (stationLat && stationLon) {
          const R = 6371000;
          const dLat = (stationLat - lat) * Math.PI / 180;
          const dLon = (stationLon - lon) * Math.PI / 180;
          const a =
            Math.sin(dLat / 2) ** 2 +
            Math.cos(lat * Math.PI / 180) *
            Math.cos(stationLat * Math.PI / 180) *
            Math.sin(dLon / 2) ** 2;
          distance = 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        const stationLabel = [station.adresse, station.ville, station.cp].filter(Boolean).join(', ');
        locationLine.textContent = `Station retenue : ${stationLabel || 'station inconnue'} — ${formatDistance(distance)}`;

        let prixMap = {};
        if (Array.isArray(station.prix)) {
          station.prix.forEach(p => {
            const nom = (p.nom || '').toLowerCase();
            const valeur = p.valeur ?? p.prix ?? null;
            if (nom.includes('gazole') || nom.includes('diesel') || nom === 'dsl') prixMap.dsl = valeur;
            if (nom.includes('sp95') || nom === 'e95') prixMap.e95 = valeur;
            if (nom.includes('sp98') || nom === 'e98') prixMap.e98 = valeur;
          });
        }

        if (prixMap.e98 != null) {
          setFuelValue('e98', prixMap.e98, `Station la plus proche • ${formatDistance(distance)}`, 'api');
        } else {
          clearUnavailableFuel('e98', 'E98 indisponible dans cette station');
        }

        if (prixMap.e95 != null) {
          setFuelValue('e95', prixMap.e95, `Station la plus proche • ${formatDistance(distance)}`, 'api');
        } else {
          clearUnavailableFuel('e95', 'E95 indisponible dans cette station');
        }

        if (prixMap.dsl != null) {
          setFuelValue('dsl', prixMap.dsl, `Station la plus proche • ${formatDistance(distance)}`, 'api');
        } else {
          clearUnavailableFuel('dsl', 'Diesel indisponible dans cette station');
        }

        showStatus('Prix récupérés sur la station la plus proche.', 'success');
        updateNote.textContent = `Prix mis à jour le ${nowLabel()}`;
      } catch (err) {
        console.error(err);
        showStatus('Erreur lors de la récupération des prix de la station la plus proche.', 'error');
        updateNote.textContent = `Dernière tentative : ${nowLabel()}`;
      }
    }

    async function locateAndFetch() {
      hideStatus();
      manualBox.classList.remove('show');

      if (!navigator.geolocation) {
        showStatus('Votre navigateur ne prend pas en charge la géolocalisation.', 'error');
        manualBox.classList.add('show');
        return;
      }

      locBtn.disabled = true;
      locBtn.textContent = 'Localisation en cours...';

      navigator.geolocation.getCurrentPosition(
        async (position) => {
          const { latitude, longitude } = position.coords;
          const label = await reverseGeocode(latitude, longitude);
          await fetchNearestStationPrices(latitude, longitude, label);
          locBtn.disabled = false;
          locBtn.textContent = '📍 Prix de la station la plus proche';
        },
        (error) => {
          const msg = geolocationErrorMessage(error);
          showStatus(msg + ' Utilise la recherche manuelle ci-dessous.', 'warning');
          locationLine.textContent = 'Aucune position GPS disponible.';
          manualBox.classList.add('show');
          locBtn.disabled = false;
          locBtn.textContent = '📍 Prix de la station la plus proche';
        },
        {
          enableHighAccuracy: true,
          timeout: 12000,
          maximumAge: 0
        }
      );
    }

    async function manualSearch() {
      const query = manualCity.value.trim();
      if (!query) {
        showStatus('Saisis une ville ou un code postal.', 'warning');
        return;
      }

      manualSearchBtn.disabled = true;
      manualSearchBtn.textContent = 'Recherche...';

      try {
        showStatus('Recherche du lieu saisi...', 'info');
        const place = await geocodeCity(query);
        await fetchNearestStationPrices(place.lat, place.lon, place.label);
        showStatus('Recherche manuelle effectuée avec succès.', 'success');
      } catch (e) {
        showStatus('Lieu introuvable. Vérifie la saisie.', 'error');
      } finally {
        manualSearchBtn.disabled = false;
        manualSearchBtn.textContent = 'Rechercher';
      }
    }

    locBtn.addEventListener('click', locateAndFetch);
    manualSearchBtn.addEventListener('click', manualSearch);

    document.querySelectorAll('.fuel-card').forEach(card => {
      card.addEventListener('click', () => {
        document.querySelectorAll('.fuel-card').forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');
      });
    });
  </script>
</body>
</html>
